name: EZRWorker

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.0.0"

options:
  minimumXcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  EZRWorker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: EZRWorkerApp
        excludes:
          - plans/**
          - EZRWorker/Views/Capabilities/Channels.md
      - path: Shared
    dependencies:
      - target: EZRWorkerSupervisor
        embed: false
      - framework: OpenDirectory.framework
        embed: false
      - sdk: Charts.framework
        embed: false
      - package: SwiftTerm
    postBuildScripts:
      - name: "Inject Git Build Number"
        script: |
          BUILD_NUM=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo 0)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
          MARKETING_VER="${EZRWORKER_MARKETING_VERSION_OVERRIDE:-${CLAWDHOME_MARKETING_VERSION_OVERRIDE:-${MARKETING_VERSION:-}}}"
          if [ -z "$MARKETING_VER" ]; then
            MARKETING_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${SRCROOT}/EZRWorkerApp/Info.plist" 2>/dev/null || echo "1.6.0")
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING_VER}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
      - name: "Embed Supervisor into App Bundle"
        script: |
          DEST_BIN="${CODESIGNING_FOLDER_PATH}/Contents/MacOS"
          DEST_AGENT="${CODESIGNING_FOLDER_PATH}/Contents/Library/LaunchAgents"
          mkdir -p "$DEST_BIN" "$DEST_AGENT"
          SRC_SUPERVISOR="${BUILT_PRODUCTS_DIR}/EZRWorkerSupervisor"
          DEST_SUPERVISOR="$DEST_BIN/EZRWorkerSupervisor"
          if [ ! -f "$DEST_SUPERVISOR" ] || ! cmp -s "$SRC_SUPERVISOR" "$DEST_SUPERVISOR"; then
            cp "$SRC_SUPERVISOR" "$DEST_SUPERVISOR"
          fi
          chmod +x "$DEST_BIN/EZRWorkerSupervisor"
          cp "${SRCROOT}/Resources/ai.ezrworker.mac.supervisor.plist" "$DEST_AGENT/"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac
        PRODUCT_NAME: EZRWorker
        APP_DISPLAY_NAME: EZRWorker
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        APP_UPDATE_MANIFEST_URL: https://imp-assets.ezrpro.com/ezrworker/updates/latest.json
        CODE_SIGN_ENTITLEMENTS: EZRWorkerApp/EZRWorker.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9P6LY282WU
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.dev
          APP_DISPLAY_NAME: EZRWorker Dev
          CODE_SIGN_ENTITLEMENTS: EZRWorkerApp/EZRWorkerDebug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac
          APP_DISPLAY_NAME: EZRWorker
          CODE_SIGN_ENTITLEMENTS: EZRWorkerApp/EZRWorker.entitlements
    info:
      path: EZRWorkerApp/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleIconFile: AppIcon.icns
        CFBundleShortVersionString: "1.1.3"
        CFBundleVersion: "1"
        AppUpdateManifestURL: $(APP_UPDATE_MANIFEST_URL)
        AuthAPIBaseURL: "https://ygos.ezrpro.com/api/"
        NSHumanReadableDescription: EZRWorker OpenClaw 管理器
        LSApplicationCategoryType: public.app-category.utilities

  EZRWorkerHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: EZRWorkerHelper
      - path: Shared
      - path: Shared/ProcessModels.swift
      - path: EZRWorkerHelper/GeneratedVersion.swift
        optional: true
        type: file
    preBuildScripts:
      - name: "Generate Helper Version"
        script: |
          BUILD_NUM="${EZRWORKER_BUILD_NUMBER_OVERRIDE:-${CLAWDHOME_BUILD_NUMBER_OVERRIDE:-${CURRENT_PROJECT_VERSION:-}}}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo 0)
          fi
          MARKETING_VER="${EZRWORKER_MARKETING_VERSION_OVERRIDE:-${CLAWDHOME_MARKETING_VERSION_OVERRIDE:-${MARKETING_VERSION:-}}}"
          if [ -z "$MARKETING_VER" ]; then
            MARKETING_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${SRCROOT}/EZRWorkerApp/Info.plist" 2>/dev/null || true)
          fi
          if [ -n "$MARKETING_VER" ] && [ -n "$BUILD_NUM" ]; then
            HELPER_VER="${MARKETING_VER} (${BUILD_NUM})"
          elif [ -n "$MARKETING_VER" ]; then
            HELPER_VER="${MARKETING_VER}"
          else
            HELPER_VER="${BUILD_NUM}"
          fi
          OUT="${SRCROOT}/EZRWorkerHelper/GeneratedVersion.swift"
          echo "// Auto-generated — do not edit" > "$OUT"
          echo "let kHelperVersion = \"${HELPER_VER}\"" >> "$OUT"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/EZRWorkerHelper/GeneratedVersion.swift
    dependencies:
      - framework: SystemConfiguration.framework
        embed: false
      - framework: OpenDirectory.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.helper
        PRODUCT_NAME: EZRWorkerHelper
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: EZRWorkerHelper/EZRWorkerHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9P6LY282WU
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.dev.helper
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.helper

  EZRWorkerSupervisor:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: EZRWorkerSupervisor
      - path: Shared
    dependencies:
      - framework: SystemConfiguration.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.supervisor
        PRODUCT_NAME: EZRWorkerSupervisor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9P6LY282WU
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.dev.supervisor
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.supervisor

schemes:
  EZRWorker:
    build:
      targets:
        EZRWorker: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
