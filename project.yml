name: ClawdHome

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.0.0"

options:
  minimumXcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

targets:
  ClawdHome:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClawdHome
      - path: Shared
    dependencies:
      - target: ClawdHomeHelper
        embed: false
      - target: EZRWorkerSupervisor
        embed: false
      - framework: OpenDirectory.framework
        embed: false
      - sdk: Charts.framework
        embed: false
      - package: SwiftTerm
    postBuildScripts:
      - name: "Inject Git Build Number"
        script: |
          BUILD_NUM=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo 0)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
          MARKETING_VER="${CLAWDHOME_MARKETING_VERSION_OVERRIDE:-${MARKETING_VERSION:-}}"
          if [ -z "$MARKETING_VER" ]; then
            MARKETING_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${SRCROOT}/ClawdHome/Info.plist" 2>/dev/null || echo "1.6.0")
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${MARKETING_VER}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || true
        basedOnDependencyAnalysis: false
      - name: "Embed Helper into App Bundle"
        script: |
          # DEBUG 模式下跳过嵌入 helper，避免 SMAppService 检测到 app bundle 中的
          # helper 变化后自动替换正在运行的 /Library/PrivilegedHelperTools/ 二进制。
          # 开发阶段使用 make install-helper 手动管理 helper。
          if [ "${CONFIGURATION}" = "Debug" ]; then
            echo "⏭ DEBUG: skip embedding helper (use 'make install-helper' instead)"
            exit 0
          fi
          DEST="${CODESIGNING_FOLDER_PATH}/Contents/Library/LaunchDaemons"
          mkdir -p "$DEST"
          cp "${BUILT_PRODUCTS_DIR}/EZRWorkerHelper" "$DEST/EZRWorkerHelper"
          chmod +x "$DEST/EZRWorkerHelper"
          cp "${SRCROOT}/Resources/ai.ezrworker.mac.helper.plist" "$DEST/"
        basedOnDependencyAnalysis: false
      - name: "Embed Supervisor into App Bundle"
        script: |
          DEST_BIN="${CODESIGNING_FOLDER_PATH}/Contents/MacOS"
          DEST_AGENT="${CODESIGNING_FOLDER_PATH}/Contents/Library/LaunchAgents"
          mkdir -p "$DEST_BIN" "$DEST_AGENT"
          cp "${BUILT_PRODUCTS_DIR}/EZRWorkerSupervisor" "$DEST_BIN/EZRWorkerSupervisor"
          chmod +x "$DEST_BIN/EZRWorkerSupervisor"
          cp "${SRCROOT}/Resources/ai.ezrworker.mac.supervisor.plist" "$DEST_AGENT/"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac
        PRODUCT_NAME: EZRWorker
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClawdHome/ClawdHome.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ClawdHome/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleIconFile: AppIcon.icns
        AuthAPIBaseURL: "http://localhost:2222"
        NSHumanReadableDescription: OpenClaw 家庭管理器
        LSApplicationCategoryType: public.app-category.utilities

  ClawdHomeHelper:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClawdHomeHelper
      - path: Shared
      - path: Shared/ProcessModels.swift
      - path: ClawdHomeHelper/GeneratedVersion.swift
        optional: true
        type: file
    preBuildScripts:
      - name: "Generate Helper Version"
        script: |
          BUILD_NUM="${CLAWDHOME_BUILD_NUMBER_OVERRIDE:-${CURRENT_PROJECT_VERSION:-}}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null || echo 0)
          fi
          MARKETING_VER="${CLAWDHOME_MARKETING_VERSION_OVERRIDE:-${MARKETING_VERSION:-}}"
          if [ -z "$MARKETING_VER" ]; then
            MARKETING_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${SRCROOT}/ClawdHome/Info.plist" 2>/dev/null || true)
          fi
          if [ -n "$MARKETING_VER" ] && [ -n "$BUILD_NUM" ]; then
            HELPER_VER="${MARKETING_VER} (${BUILD_NUM})"
          elif [ -n "$MARKETING_VER" ]; then
            HELPER_VER="${MARKETING_VER}"
          else
            HELPER_VER="${BUILD_NUM}"
          fi
          OUT="${SRCROOT}/ClawdHomeHelper/GeneratedVersion.swift"
          echo "// Auto-generated — do not edit" > "$OUT"
          echo "let kHelperVersion = \"${HELPER_VER}\"" >> "$OUT"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/ClawdHomeHelper/GeneratedVersion.swift
    dependencies:
      - framework: SystemConfiguration.framework
        embed: false
      - framework: OpenDirectory.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.helper
        PRODUCT_NAME: EZRWorkerHelper
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClawdHomeHelper/ClawdHomeHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  EZRWorkerSupervisor:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: EZRWorkerSupervisor
      - path: Shared
    dependencies:
      - framework: SystemConfiguration.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ezrworker.mac.supervisor
        PRODUCT_NAME: EZRWorkerSupervisor
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
